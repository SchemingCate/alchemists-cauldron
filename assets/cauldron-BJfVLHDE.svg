<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" fill="none" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Cauldron</title>
  <defs>
    <!-- hand-drawn look: slightly wobbly edges -->
    <filter id="tex-cauldron" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4" result="wobble"/>
      <feDisplacementMap in="SourceGraphic" in2="wobble" scale="4.0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#tex-cauldron)">
  <!-- feet -->
  <path d="M62 186 C56 200 54 208 60 212 C70 214 76 206 80 194 Z" fill="#3A3548" stroke="#4A3428" stroke-width="3"/>
  <path d="M178 186 C184 200 186 208 180 212 C170 214 164 206 160 194 Z" fill="#3A3548" stroke="#4A3428" stroke-width="3"/>
  <!-- handles -->
  <path d="M28 96 C10 98 8 122 26 126" stroke="#4A3428" stroke-width="9"/>
  <path d="M28 96 C10 98 8 122 26 126" stroke="#6B6580" stroke-width="4"/>
  <path d="M212 96 C230 98 232 122 214 126" stroke="#4A3428" stroke-width="9"/>
  <path d="M212 96 C230 98 232 122 214 126" stroke="#6B6580" stroke-width="4"/>
  <!-- pot -->
  <path id="pot" d="M30 78 C18 140 52 200 120 200 C190 201 223 140 210 78 Z" fill="#4A4560" stroke="#4A3428" stroke-width="3"/>
  <path d="M50 104 C46 134 58 162 82 178" stroke="#FFF8EC" stroke-width="5" opacity="0.22"/>
  <path d="M44 150 C80 166 162 168 198 148" stroke="#3A3548" stroke-width="3" opacity="0.7"/>
  <!-- rim -->
  <path d="M20 72 C22 58 218 57 220 72 C221 88 20 89 20 72 Z" fill="#6B6580" stroke="#4A3428" stroke-width="3"/>
  <!-- liquid: recolour #liquid to show the potion -->
  <path id="liquid" d="M36 73 C62 63 178 63 204 73 C180 82 62 83 36 73 Z" fill="#9ED9B5" stroke="#4A3428" stroke-width="2"/>
  <g id="bubbles" fill="#C8F0D8" stroke="#4A3428" stroke-width="1.5">
    <circle cx="92" cy="70" r="5"/>
    <circle cx="140" cy="68" r="3.5"/>
    <circle cx="165" cy="73" r="2.5"/>
  </g>
  </g>
</svg>
