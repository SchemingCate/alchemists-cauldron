  <path id="ribbon" d="M98 180 L98 206 L104 199 L110 206 L110 180 Z" fill="#D9534F"/>
  <!-- cover -->
  <path id="cover" d="M18 20 C18 14 22 11 28 11 L126 9 C132 9 136 13 136 19 L138 178 C138 184 134 188 128 188 L28 190 C22 190 18 186 18 180 Z" fill="#A0603F"/>
  <path d="M34 11 L34 190" stroke-width="2.5"/>
  <path d="M19 22 C19 16 23 12 28 12 L33 12 L33 189 L28 189 C23 189 19 185 19 180 Z" fill="#7E4A30" stroke="none"/>
  <!-- gold corners -->
  <path d="M136 26 L136 19 C136 13 132 9 126 9 L119 9 Z" fill="#F2C14E" stroke-width="2"/>
  <path d="M138 171 L138 178 C138 184 134 188 128 188 L121 188 Z" fill="#F2C14E" stroke-width="2"/>
