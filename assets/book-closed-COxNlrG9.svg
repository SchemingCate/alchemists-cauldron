<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 212" fill="none" stroke="#4A3428" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Recipe book, closed</title>
  <defs>
    <!-- hand-drawn look: slightly wobbly edges -->
    <filter id="tex-book-closed" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="wobble"/>
      <feDisplacementMap in="SourceGraphic" in2="wobble" scale="2.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#tex-book-closed)">
  <!-- pages peeking out -->
  <path d="M30 18 L138 16 C143 16 146 19 146 24 L148 176 C148 181 145 184 140 184 L32 186 Z" fill="#FFF3DC"/>
  <path d="M140 30 L142 172 M135 28 L137 174" stroke-width="1.5" opacity="0.6"/>
