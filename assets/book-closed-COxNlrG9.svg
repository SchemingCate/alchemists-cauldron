  <path d="M90 60 C76 62 68 76 72 90 C76 102 90 106 100 100 C88 98 80 88 82 76 C83 68 86 63 90 60 Z" fill="#F2C14E" stroke-width="2"/>
  <path d="M100 68 L102 73 L107 74 L103 77 L104 82 L100 79 L96 82 L97 77 L93 74 L98 73 Z" fill="#F2C14E" stroke-width="1.5"/>
  <!-- label plate -->
  <path d="M56 130 C70 128 102 128 116 130 L116 154 C102 152 70 152 56 154 Z" fill="#FFF3DC" stroke-width="2.5"/>
  <path d="M66 138 L106 138 M70 145 L102 145" stroke="#C9A77E" stroke-width="2"/>
  </g>
</svg>
