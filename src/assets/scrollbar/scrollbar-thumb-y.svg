<svg xmlns="http://www.w3.org/2000/svg" width="20" height="120" viewBox="0 0 20 120" fill="none" stroke="#4A3428" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Vertical scrollbar thumb: wooden handle with arrow tips. border-image-slice: 16 0 fill</title>
  <defs>
    <!-- hand-drawn look: slightly wobbly edges -->
    <filter id="tex-scrollbar-thumb-y" x="-10%" y="-3%" width="120%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="73" result="wobble"/>
      <feDisplacementMap in="SourceGraphic" in2="wobble" scale="1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- the horizontal thumb, mirrored onto the diagonal (x and y swapped) -->
  <g filter="url(#tex-scrollbar-thumb-y)"><g transform="matrix(0 1 1 0 0 0)">
    <!-- body: plain horizontal lines only, so the middle can stretch -->
    <path d="M14 5 L106 5 L106 15 L14 15 Z" fill="#D2A678" stroke="none"/>
    <path d="M14 5 L106 5 M14 15 L106 15"/>
    <path d="M14 8 L106 8" stroke="#FFF1C2" stroke-width="2" opacity="0.7"/>
    <path d="M14 12.5 L106 12.5" stroke="#B98058" stroke-width="1.5"/>
    <!-- arrow tips: a bit wider than the body, pointing outwards (all inside the outer 16 units) -->
    <path d="M16 1.5 L2 10 L16 18.5 L14 15 L14 5 Z" fill="#B98058"/>
    <path d="M104 1.5 L118 10 L104 18.5 L106 15 L106 5 Z" fill="#B98058"/>
    <path d="M12 6 L6 10" stroke="#D2A678" stroke-width="1.5"/>
    <path d="M108 6 L114 10" stroke="#D2A678" stroke-width="1.5"/>
  </g></g>
</svg>
