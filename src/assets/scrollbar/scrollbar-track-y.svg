<svg xmlns="http://www.w3.org/2000/svg" width="20" height="120" viewBox="0 0 20 120" fill="none" stroke-linecap="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Vertical scrollbar track: carved groove (background-repeat: repeat-y)</title>
  <defs>
    <!-- hand-drawn look: slightly wobbly edges -->
    <filter id="tex-scrollbar-track-y" filterUnits="userSpaceOnUse" x="-4" y="0" width="28" height="120">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="71" stitchTiles="stitch" result="wobble"/>
      <feDisplacementMap in="SourceGraphic" in2="wobble" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- the horizontal track, mirrored onto the diagonal (x and y swapped) -->
  <g filter="url(#tex-scrollbar-track-y)"><g transform="matrix(0 1 1 0 0 0)"><path d="M-120 4 L0 4 L0 16 L-120 16 Z" fill="#8A5E40" stroke="none"/><path d="M-120 6 L0 6" stroke="#6E4A33" stroke-width="3" opacity="0.6"/><path d="M-120 4 L0 4 M-120 16 L0 16" stroke="#4A3428" stroke-width="2.5"/><path d="M-120 17.5 L0 17.5" stroke="#D2A678" stroke-width="1.5"/><path d="M0 4 L120 4 L120 16 L0 16 Z" fill="#8A5E40" stroke="none"/><path d="M0 6 L120 6" stroke="#6E4A33" stroke-width="3" opacity="0.6"/><path d="M0 4 L120 4 M0 16 L120 16" stroke="#4A3428" stroke-width="2.5"/><path d="M0 17.5 L120 17.5" stroke="#D2A678" stroke-width="1.5"/><path d="M120 4 L240 4 L240 16 L120 16 Z" fill="#8A5E40" stroke="none"/><path d="M120 6 L240 6" stroke="#6E4A33" stroke-width="3" opacity="0.6"/><path d="M120 4 L240 4 M120 16 L240 16" stroke="#4A3428" stroke-width="2.5"/><path d="M120 17.5 L240 17.5" stroke="#D2A678" stroke-width="1.5"/></g></g>
</svg>
