<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -16 160 96" fill="none" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Fire</title>
  <defs>
    <!-- hand-drawn look: slightly wobbly edges -->
    <filter id="tex-fire" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5" result="wobble"/>
      <feDisplacementMap in="SourceGraphic" in2="wobble" scale="2.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#tex-fire)">
    <!-- each flame tongue is its own element, so it can be animated separately -->
    <g id="flames-outer" fill="#F29E4C" stroke="#4A3428" stroke-width="3">
      <path id="flame-left" d="M18 74 C8 58 20 46 28 30 C34 44 42 40 46 26 C52 42 58 54 62 74 Z"/>
      <path id="flame-right" d="M96 74 C98 54 106 44 112 22 C120 36 128 44 132 32 C146 50 148 64 142 74 Z"/>
      <path id="flame-center" d="M48 74 C42 52 58 36 66 12 C72 28 80 22 86 6 C96 26 104 44 104 74 Z"/>
    </g>
    <g id="flames-inner" fill="#F7D06B">
      <path id="inner-left" d="M34 74 C30 64 38 56 44 46 C50 56 56 64 58 74 Z"/>
      <path id="inner-center" d="M62 74 C58 60 68 48 76 30 C84 46 94 56 92 74 Z"/>
      <path id="inner-right" d="M100 74 C100 64 108 58 114 48 C122 58 128 66 126 74 Z"/>
    </g>
    <g id="embers" fill="#F7D06B" stroke="#4A3428" stroke-width="1.5">
      <circle id="ember-1" cx="50" cy="4" r="2.5"/>
      <circle id="ember-2" cx="82" cy="-8" r="2"/>
      <circle id="ember-3" cx="118" cy="6" r="2.5"/>
    </g>
    <!-- logs stay still -->
    <path id="logs" d="M14 70 C40 64 120 64 146 70 C148 76 146 79 140 79 C110 76 50 76 20 79 C14 79 12 75 14 70 Z" fill="#9A6A48" stroke="#4A3428" stroke-width="3"/>
  </g>
</svg>
