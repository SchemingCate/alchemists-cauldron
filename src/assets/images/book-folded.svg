<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 244" fill="none" stroke="#4A3428" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Recipe book, folded open to one page</title>
  <defs>
    <!-- hand-drawn look: slightly wobbly edges -->
    <filter id="tex-book-folded" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="wobble"/>
      <feDisplacementMap in="SourceGraphic" in2="wobble" scale="3.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#tex-book-folded)">
  <!-- cover and other half folded behind -->
  <path id="cover" d="M10 26 C10 20 14 18 20 18 L170 14 C176 14 180 18 180 24 L184 222 C184 228 180 232 174 232 L22 236 C16 236 12 232 12 226 Z" fill="#A0603F"/>
  <path d="M18 20 L176 16 L180 222 L22 228 Z" fill="#EBD9B8"/>
  <!-- visible page: keep the middle empty for the recipe text in HTML -->
  <path id="page" d="M28 12 C80 8 140 8 186 12 L188 214 C140 210 80 210 30 218 Z" fill="#FFF3DC"/>
  <!-- curve and shadow along the spine -->
  <path d="M29 13 C35 15 40 17 44 19 L45 213 C40 214 35 216 31 217 Z" fill="#E9D3AE" stroke="none" opacity="0.8"/>
  <path d="M44 20 L45 212" stroke-width="2" opacity="0.5"/>
  <!-- dog-eared corner -->
  <path d="M188 188 L188 214 C178 212 170 212 162 212 Z" fill="#EBD9B8" stroke-width="2.5"/>
  <!-- little corner flourishes -->
  <g stroke="#C9A77E" stroke-width="2">
    <path d="M58 26 C68 22 76 22 82 26"/>
    <path d="M172 26 C162 22 154 22 148 26"/>
    <path d="M58 198 C68 194 76 194 82 198"/>
  </g>
  <path d="M68 32 L70 36 L74 37 L70 38 L68 42 L66 38 L62 37 L66 36 Z" fill="#F2C14E" stroke-width="1.5"/>
  <path d="M162 32 L164 36 L168 37 L164 38 L162 42 L160 38 L156 37 L160 36 Z" fill="#F2C14E" stroke-width="1.5"/>
  <!-- bookmark ribbon -->
  <path id="ribbon" d="M112 214 L112 240 L118 233 L124 240 L124 212 Z" fill="#D9534F"/>
  </g>
</svg>
